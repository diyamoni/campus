<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        form { background: white; border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 400px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; }
        button { background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
    <br>
    <a href="/">Back to Home</a>
</body>
</html>
